<div class="robot-hero"><div class="robot-hero-copy"><p class="meta">October 19, 2026 · Ben Reilly, Jeff Hsu</p><h1>LabRobotBench V0.1</h1><p class="lead">Gamow Labs builds frontier AI systems to interpret the human genome. We’re building an agent-operated lab to accelerate that work.</p></div><figure class="robot-hero-animation"><iframe/></figure></div>
<div class="robot-intro"><p class="lead">Our in-silico simulation mirrors the command interfaces of our physical robots, allowing us to develop and evaluate agents that can run experiments and recover from equipment failures.</p><p class="lead">When a robot encounters an error, an experiment can stall until a person steps in. Agents that can diagnose the problem and safely resume work could keep experiments running overnight, reduce downtime, and let scientists run more experiments at once. This is what we’re building at Gamow Labs: accelerating human progress by using agents to increase experimental throughput.</p><p class="lead">To address this challenge, we present LabRobotBench. Its evaluations test how frontier AI models reason about physical space and complex biological workflows to troubleshoot and carry out wet-lab experiments.</p><p><a href="#scores">Results</a> · <a href="#case-1">Cell assay recovery</a> · <a href="#case-2">Assays and cold stocks</a> · <a href="#case-3">Dose-response recovery</a> · <a href="#partner">Partner with us</a></p></div>

<div class="post-body"><section id="scores"><div class="eyebrow">01 / RECOVERING INTERRUPTED EXPERIMENTS</div><h2>Results</h2><p class="lead">How much of the required physical workflow does each agent recover?</p><div class="leaderboard"><h3 id="chart-title">Mean score across our held-out subset</h3><div class="axis"><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div><ol id="aggregate-chart"><li><div class="model-name"><strong>GPT 6.1 Sol</strong><small>Codex</small></div><div class="chart-track"><span/></div><div class="chart-score">46.7%</div></li><li><div class="model-name"><strong>Opus 5.5</strong><small>Claude Code</small></div><div class="chart-track"><span/></div><div class="chart-score">23.0%</div></li><li><div class="model-name"><strong>Gemini 4 Argon</strong><small>Gemini CLI</small></div><div class="chart-track"><span/></div><div class="chart-score">20.9%</div></li></ol></div></section><section id="case-1"><div class="eyebrow">CASE 01 · Recovering an interrupted cell assay</div><h2>Finishing an interrupted experiment</h2><p class="lead">A robot stopped halfway through an experiment involving four trays of cells. Three could still be tested. The agent needed to finish preparing them, measure the results, and put them away. The fourth was already spoiled and needed to be set aside.</p><div class="two"><div><h3>What the agent needed to do</h3><p>Each tray was at a different step when the robot stopped. The agent had to work out which steps were already done, then finish washing the cells, add a chemical used to measure cell activity, and run the measuring instrument. It also needed to save the results and return each tray with its lid. Repeating a chemical treatment could ruin a sample.</p></div><div><h3>Why it matters in a wet lab</h3><p>A tray can be safely back on its shelf while the experiment is still unfinished. The important question is whether the cells received the right treatment and were measured in time.</p></div></div><figure class="film"><h3>Opus puts an unfinished assay back on the shelf.</h3><p>Watch Opus put the yellow-labeled tray back on the shelf. Its cells have been washed, but the agent never adds the chemical needed for the test or measures the result. The tray is put away; the experiment is left unfinished.</p><iframe/></figure></section><section id="case-2"><div class="eyebrow">CASE 02 · Rescuing assays and cold stocks</div><h2>The cost of choosing what to save first</h2><p class="lead">The agent had several jobs competing for its attention: finish two experiments, set aside one spoiled sample, return two trays of supplies to cold storage, and leave a comparison sample untouched. Some of these jobs had only a few minutes left.</p><div class="two"><div><h3>What the agent needed to do</h3><p>One experiment needed its next chemical addition finished within 200 seconds. The cold supplies could spend no more than 240 seconds outside storage. Because the same robot moved all the trays, the agent had to choose what to handle first.</p></div><div><h3>Why it matters in a wet lab</h3><p>In a lab, helping one sample can mean leaving another waiting. An agent needs to keep track of both deadlines and choose an order that protects the materials.</p></div></div><div class="callout"><b>The agents chose different priorities.</b><p>GPT gets both trays of cold supplies back in time but fails to finish one experiment. Opus finishes both experiments, but leaves both trays of supplies out too long.</p></div><figure class="film"><h3>Cold supplies return to storage too late.</h3><p>Watch Gemini carry the red-labeled tray to the cold-storage machine. By the time the tray is stored inside, it has spent about 422 seconds outside—well past the 240-second limit. The robot moves it successfully, but too late to satisfy the task.</p><iframe/></figure></section><section id="case-3"><div class="eyebrow">CASE 03 · Finishing a time-sensitive dose-response assay</div><h2>A completed read can still be too late</h2><p class="lead">This experiment tests how cells respond to different amounts of a chemical. The agent needed to finish testing two trays of cells and set aside a third that was already spoiled. One tray was close to its measurement deadline.</p><div class="two"><div><h3>What the agent needed to do</h3><p>The agent was expected to finish an experiment within a fixed timeframe. After the cells were treated with the test chemical, it had 30 minutes to complete a measurement of their response. It needed to check which steps were already done, finish preparing the samples, and leave enough time for the measuring instrument to run.</p></div><div><h3>Why it matters in a wet lab</h3><p>Timing requirements like this are common in live biology experiments, where a sample’s response can change after treatment. Taking measurements at the required time helps scientists compare results across samples. The agent therefore needs to plan around the experiment’s timing, as well as operate the equipment.</p></div></div><figure class="film"><h3>GPT collects a result that missed the deadline.</h3><p>Watch GPT take the tray out of the measuring instrument. The machine has finished, but its measurement ended 42.5 seconds after the deadline. The robot carries on normally, and the agent later reports the test as completed.</p><iframe/></figure></section><section id="partner"><div class="eyebrow">Partner with us</div><h2>Build the future of experimental biology.</h2><p class="lead">At Gamow Labs, we work at the frontier of AI and wet-lab biology to better understand rare diseases. We’re building agents that can operate robotic laboratories and help scientists uncover how genetic changes cause disease.</p><p class="lead">If you’re developing frontier models, building laboratory automation, or looking to expand your experimental capabilities, we’d love to work with you.</p><p><a href="mailto:daniel@gamowlabs.com">Partner with Gamow Labs ↗</a></p></section></div>
